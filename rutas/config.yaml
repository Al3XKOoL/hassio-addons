name: Servidor Señales Rutas GPS
version: "1.0.0"
slug: rutas_senales
description: Servidor de señalización WebSocket para app Rutas GPS (master/esclavo). Funciona con Cloudflared para acceso externo sin abrir puertos.
url: "https://github.com/Al3XKOoL/hassio-addons"
codenotify: false
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
uart: false
hassio_api: false
hassio_role: default
full_access: false
homeassistant_api: false
protect: false
devices: []
network:
  ports:
    3000/tcp: 3000
  ports_description:
    3000/tcp: Puerto WebSocket para señalización master/esclavo
image: ghcr.io/al3xkool/rutas-senales-{arch}
boot: auto
startup: services
options:
  server_master_key: "CAMBIA_ESTA_CLAVE"
  session_ttl_ms: 3600000
  log_level: "info"
schema:
  server_master_key: str
  session_ttl_ms: int
  log_level: str
